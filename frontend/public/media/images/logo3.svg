<svg width="300" height="300" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="coolGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6a11cb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2575fc;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="300" height="300" rx="40" fill="#1a1a2e"/>
  <path d="M60 180 C80 220, 120 220, 140 180 S 200 140, 220 180 L 240 160" stroke="url(#coolGradient)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M240 160 L 220 185 L 200 170" fill="url(#coolGradient)" filter="url(#glow)"/>
  <circle cx="240" cy="160" r="8" fill="#fff" filter="url(#glow)"/>
  <text x="150" y="260" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="bold" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="2">TRADEWAVE</text>
  <text x="150" y="285" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#a0a0a0" text-anchor="middle">GEN Z TRADING</text>
</svg>