<svg width="400" height="200" viewBox="0 0 400 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="coolGradientRect" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6a11cb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2575fc;stop-opacity:1" />
    </linearGradient>
    <filter id="glowRect">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="200" rx="20" fill="#1a1a2e"/>
  <path d="M50 120 C80 160, 140 160, 170 120 S 260 80, 290 120 L 320 90" stroke="url(#coolGradientRect)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowRect)"/>
  <path d="M320 90 L 300 115 L 280 100" fill="url(#coolGradientRect)" filter="url(#glowRect)"/>
  <circle cx="320" cy="90" r="6" fill="#fff" filter="url(#glowRect)"/>
  <text x="200" y="165" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="bold" font-size="24" fill="#ffffff" text-anchor="middle" letter-spacing="2">TRADEWAVE</text>
  <text x="200" y="185" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#a0a0a0" text-anchor="middle">GEN Z TRADING</text>
</svg>